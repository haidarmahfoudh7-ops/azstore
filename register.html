<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — AZ Store</title>
<link rel="icon" href="logo.jpeg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="logo.jpeg" alt="AZ Store" class="logo">
      <span class="brand-name">AZ<span>Store</span></span>
    </a>
    <nav class="nav-links" style="margin-left:auto;">
      <a href="index.html">Boutique</a>
    </nav>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Créer un compte</h1>
    <p class="sub">Rejoins AZ Store en quelques secondes.</p>

    <div class="form-msg" id="formMsg"></div>

    <form id="registerForm">
      <div class="field">
        <label for="pseudo">Pseudo Roblox</label>
        <input type="text" id="pseudo" required placeholder="TonPseudoRoblox">
      </div>
      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" required autocomplete="email" placeholder="toi@exemple.com">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="6 caractères minimum">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Créer mon compte</button>
    </form>

    <p class="auth-switch">Déjà un compte ? <a href="login.html">Se connecter</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("formMsg");
    msg.className = "form-msg";

    const pseudo = document.getElementById("pseudo").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    btn.textContent = "Création...";

    try {
      await Auth.register(email, password, pseudo);
      msg.textContent = "Compte créé avec succès. Redirection...";
      msg.classList.add("show", "success");
      setTimeout(() => { window.location.href = "index.html"; }, 700);
    } catch (err) {
      msg.textContent = Auth.translateError(err);
      msg.classList.add("show", "error");
      btn.disabled = false;
      btn.textContent = "Créer mon compte";
    }
  });

  (async () => {
    const user = await Auth.getUser();
    if (user) window.location.href = "index.html";
  })();
</script>
</body>
</html>
