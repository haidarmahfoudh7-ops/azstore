<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — AZ Store</title>
<link rel="icon" href="logo.jpeg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="logo.jpeg" alt="AZ Store" class="logo">
      <span class="brand-name">AZ<span>Store</span></span>
    </a>
    <nav class="nav-links" style="margin-left:auto;">
      <a href="index.html">Boutique</a>
    </nav>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Content de te revoir</h1>
    <p class="sub">Connecte-toi pour suivre tes commandes.</p>

    <div class="form-msg" id="formMsg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" required autocomplete="email" placeholder="toi@exemple.com">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Se connecter</button>
    </form>

    <p class="auth-switch">Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("formMsg");
    msg.className = "form-msg";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    btn.textContent = "Connexion...";

    try {
      await Auth.login(email, password);
      msg.textContent = "Connexion réussie. Redirection...";
      msg.classList.add("show", "success");
      const isAdmin = await Auth.isAdmin();
      setTimeout(() => { window.location.href = isAdmin ? "admin/index.html" : "index.html"; }, 600);
    } catch (err) {
      msg.textContent = Auth.translateError(err);
      msg.classList.add("show", "error");
      btn.disabled = false;
      btn.textContent = "Se connecter";
    }
  });

  // Redirige si déjà connecté
  (async () => {
    const user = await Auth.getUser();
    if (user) window.location.href = "index.html";
  })();
</script>
</body>
</html>
